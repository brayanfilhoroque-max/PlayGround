<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CHICLE ROYALE</title><style>
:html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b20;font-family:Impact,'Arial Black',sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#menu{position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,#ff3eaa33,transparent 28%),linear-gradient(135deg,#171532 0%,#0a0d24 65%,#071126);color:white;overflow:hidden}.logo{position:absolute;top:3.5%;left:4%;z-index:2}.logo h1{margin:0;font-size:clamp(38px,6vw,78px);font-style:italic;letter-spacing:-3px;line-height:.78;text-shadow:5px 6px 0 #8225b7,9px 9px 0 #ffb1dc} .logo b{color:#ffdd42}.logo span{display:block;font-family:Arial;font-size:10px;letter-spacing:8px;margin:18px 0 0 5px;color:#b7bbd9}.hero{position:absolute;right:-2%;bottom:-6%;height:95%;width:46%;filter:drop-shadow(-20px 18px 20px #000)}.hero svg{width:100%;height:100%}.panel{position:absolute;left:4%;bottom:6%;width:min(520px,50%);z-index:3}.mode{display:flex;gap:8px;margin-bottom:12px}.mode button,.map-card{border:1px solid #ffffff22;background:#17183d;color:#fff;border-radius:14px;cursor:pointer}.mode button{padding:10px 20px;font:900 12px Arial}.mode button.active{background:#b92bc2;border-color:#f8b9ff}.map-row{display:flex;gap:8px}.map-card{width:92px;height:72px;padding:0;overflow:hidden;text-align:left;position:relative}.map-card .thumb{height:50px;background:var(--bg)}.map-card span{position:absolute;bottom:5px;left:6px;font:900 8px Arial;text-shadow:1px 2px 2px #000}.map-card.active{outline:3px solid #ffdc4a}.play{width:100%;height:68px;margin-top:10px;border:0;border-radius:16px;background:linear-gradient(135deg,#ffd83d,#ff7a35);color:#26132e;font-size:24px;font-style:italic;cursor:pointer;box-shadow:0 8px 0 #a74a24}.stats{position:absolute;right:3%;top:4%;display:flex;gap:8px}.pill{background:#10142bcc;border:1px solid #ffffff18;border-radius:22px;padding:8px 13px;font:900 12px Arial}.pill em{color:#ffdc4a;font-style:normal}.topnav{position:absolute;right:3%;bottom:3%;display:flex;gap:8px}.topnav button{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff22;background:#17183dcc;color:#fff;font-size:17px}
#hud{display:none;position:absolute;inset:0;color:white;pointer-events:none}.hudtop{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center}.alive{background:#11152bd9;border:1px solid #ffffff22;border-radius:16px;padding:8px 14px;font:900 13px Arial}.zone{margin-top:6px;font:900 10px Arial;color:#ffdc4a}.health{position:absolute;left:18px;bottom:18px;width:210px}.bar{height:14px;border-radius:8px;background:#181827;border:2px solid #fff7;overflow:hidden}.bar i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#65ffb0,#aaff55)}.health b{font:900 11px Arial}.ammo{position:absolute;right:18px;bottom:112px;text-align:right}.ammo b{font-size:24px}.ammo span{font:900 10px Arial;color:#bfc5df}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;box-shadow:0 0 8px #000}.cross:after{content:'';position:absolute;width:4px;height:4px;border-radius:50%;background:#ffdc4a;left:5px;top:5px}.stick{position:absolute;bottom:28px;width:110px;height:110px;border-radius:50%;background:#ffffff12;border:2px solid #ffffff25;pointer-events:auto}.stick.left{left:18px}.stick.right{right:18px}.stick:after{content:'';position:absolute;left:34px;top:34px;width:38px;height:38px;border-radius:50%;background:#ffffff35}.action{position:absolute;pointer-events:auto;border:1px solid #ffffff55;border-radius:50%;background:#17172aa0;color:#fff;font:900 10px Arial}.jump{right:145px;bottom:72px;width:58px;height:58px}.gum{right:138px;bottom:138px;width:68px;height:68px;background:linear-gradient(135deg,#ff5bb5,#8d4dff);font-size:9px}.shoot{right:28px;bottom:148px;width:82px;height:82px;border:5px solid #ffffff55;background:#ffcc3390;font-size:11px}.inventory{position:absolute;left:18px;top:18px}.slot{width:42px;height:42px;margin-bottom:6px;border-radius:10px;background:#11152bbd;border:1px solid #ffffff22;text-align:center;padding-top:12px;font:900 10px Arial}.titlecard{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;text-shadow:0 4px 15px #000}.titlecard h2{font-size:clamp(28px,6vw,68px);margin:0;font-style:italic}.titlecard p{font:900 13px Arial;letter-spacing:5px;color:#ffdc4a}.leave{display:none;position:absolute;right:18px;top:18px;pointer-events:auto;border:1px solid #fff3;background:#11152b;color:#fff;border-radius:10px;padding:8px 12px;font:900 10px Arial}@media(max-width:700px){.hero{opacity:.85;width:58%;right:-12%}.logo h1{font-size:44px}.logo{top:2.5%}.panel{width:92%;left:4%;bottom:3%}.map-card{width:19%;height:58px}.map-card .thumb{height:38px}.stats{display:none}.health{width:140px}.stick{width:92px;height:92px}.stick:after{left:27px;top:27px}.jump{right:110px}.gum{right:104px}.shoot{width:70px;height:70px}.topnav{display:none}}
</style></head><body>
<div id="menu"><div class="logo"><h1>CHICLE<br><b>ROYALE</b></h1><span>DROP • STICK • WIN</span></div><div class="stats"><div class="pill">👑 <em>OURO II</em></div><div class="pill">🏆 0 VITÓRIAS</div></div>
<div class="hero"><svg viewBox="0 0 500 700"><ellipse cx="260" cy="670" rx="170" ry="24" fill="#050617"/><g transform="translate(70 30)"><path d="M170 210 L270 220 L330 510 L230 560 L155 520Z" fill="#17132f"/><path d="M105 230 L190 220 L150 520 L70 510Z" fill="#ffde45"/><path d="M105 230 L35 330 L75 355 L150 255Z" fill="#d86b8a"/><path d="M270 220 L345 320 L310 350 L230 260Z" fill="#d86b8a"/><path d="M155 520 L215 560 L195 610 L125 610Z" fill="#20203b"/><path d="M230 560 L310 510 L340 610 L270 610Z" fill="#20203b"/><circle cx="190" cy="145" r="82" fill="#b96a67"/><path d="M112 145 Q95 35 195 35 Q292 55 270 180 L235 130 Q170 145 112 145Z" fill="#16142f"/><path d="M125 48 Q195 5 262 64 L230 95 Q190 65 125 48Z" fill="#8b35b5"/><circle cx="160" cy="150" r="6" fill="#222"/><circle cx="225" cy="150" r="6" fill="#222"/><path d="M175 190 Q205 210 230 186" fill="none" stroke="#fff" stroke-width="5"/><path d="M155 228 Q205 260 270 220 L250 290 Q195 310 145 275Z" fill="#8f2ca0"/><circle cx="195" cy="280" r="8" fill="#ffd83d"/><circle cx="80" cy="345" r="25" fill="#b96a67"/><circle cx="328" cy="348" r="25" fill="#b96a67"/><path d="M130 310 L245 310" stroke="#ff70b7" stroke-width="12"/><path d="M255 320 L335 290" stroke="#30314e" stroke-width="24"/><rect x="318" y="270" width="20" height="95" rx="8" fill="#aaa" transform="rotate(-16 318 270)"/><circle cx="240" cy="580" r="18" fill="#ff70b7"/><circle cx="335" cy="580" r="18" fill="#65e7ff"/></g></svg></div>
<div class="panel"><div class="mode"><button class="active" data-mode="SOLO">SOLO</button><button data-mode="DUPLA">DUPLA</button><button data-mode="SQUAD">SQUAD</button></div><div class="map-row"><button class="map-card active" data-map="0" style="--bg:linear-gradient(135deg,#ff8a48,#5a2b75)"><div class="thumb"></div><span>CIDADE<br>DO CAOS</span></button><button class="map-card" data-map="1" style="--bg:linear-gradient(135deg,#ffe7a2,#19b4c9)"><div class="thumb"></div><span>ILHA DOS<br>PIRATAS</span></button><button class="map-card" data-map="2" style="--bg:linear-gradient(135deg,#d98b48,#3b8b62)"><div class="thumb"></div><span>DESERTO<br>RADIOATIVO</span></button><button class="map-card" data-map="3" style="--bg:linear-gradient(135deg,#5ccd83,#174a3a)"><div class="thumb"></div><span>FLORESTA<br>MISTERIOSA</span></button><button class="map-card" data-map="4" style="--bg:linear-gradient(135deg,#eb4cd1,#3177ff)"><div class="thumb"></div><span>METRÓPOLE<br>NEON</span></button></div><button class="play" id="play">JOGAR AGORA</button></div><div class="topnav"><button>🧰</button><button>👕</button><button>⚙</button></div></div>
<canvas id="game"></canvas><div id="hud"><div class="inventory"><div class="slot">AK<br>30</div><div class="slot">+<br>5</div></div><div class="hudtop"><div class="alive">50 JOGADORES<br><span id="kills">0 ELIMINAÇÕES</span></div><div class="zone">◷ ZONA FECHA EM <b id="timer">1:00</b></div></div><div class="health"><div class="bar"><i id="hp"></i></div><b id="hptext">HP 100 / 100</b></div><div class="ammo"><b>30</b> / 120<br><span>CHICLE BLASTER</span></div><div class="cross"></div><div class="stick left" id="moveStick"></div><div class="stick right" id="lookStick"></div><button class="action jump" id="jump">PULAR</button><button class="action gum" id="gum">CHICLETE</button><button class="action shoot" id="shoot">DISPARO</button><button class="leave" id="leave">SAIR</button><div class="titlecard" id="titlecard"><h2 id="dropTitle">CIDADE DO CAOS</h2><p id="dropSub">PREPARANDO PARAQUEDAS</p></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const maps=[{name:'CIDADE DO CAOS',ground:'#527c72',sky:'#7cc8db',accent:'#ff6d71',kind:'city'},{name:'ILHA DOS PIRATAS',ground:'#d1b267',sky:'#55bcd8',accent:'#f8cf54',kind:'island'},{name:'DESERTO RADIOATIVO',ground:'#c58a48',sky:'#67b0a8',accent:'#91df50',kind:'desert'},{name:'FLORESTA MISTERIOSA',ground:'#2f6645',sky:'#91b9a1',accent:'#d7e95d',kind:'forest'},{name:'METRÓPOLE NEON',ground:'#24284f',sky:'#11153b',accent:'#ff43ca',kind:'neon'}];let mapIndex=0,mode='SOLO',playing=false,won=false,last=0,time=60,score=0,player={x:0,y:0,angle:-Math.PI/2,hp:100,vy:0,ground:true,gum:0,gumT:0,ammo:30};let bots=[];
document.querySelectorAll('.map-card').forEach(b=>b.onclick=()=>{document.querySelectorAll('.map-card').forEach(x=>x.classList.remove('active'));b.classList.add('active');mapIndex=+b.dataset.map});document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode});
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function makeBots(){bots=[];for(let i=0;i<18;i++){let a=Math.random()*Math.PI*2,r=120+Math.random()*600;bots.push({x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,hp:40+Math.random()*60,a:Math.random()*6.28,dead:false,phase:Math.random()*6})}}
function start(){document.getElementById('menu').style.display='none';document.getElementById('hud').style.display='block';document.getElementById('leave').style.display='block';playing=true;won=false;time=60;score=0;player={x:0,y:0,angle:-Math.PI/2,hp:100,vy:0,ground:true,gum:0,gumT:0,ammo:30};makeBots();document.getElementById('dropTitle').textContent=maps[mapIndex].name;document.getElementById('dropSub').textContent='ENTRADA POR PARAQUEDAS';document.getElementById('titlecard').style.display='block';setTimeout(()=>{document.getElementById('titlecard').style.display='none'},2200);last=performance.now();requestAnimationFrame(loop)}document.getElementById('play').onclick=start;document.getElementById('leave').onclick=()=>location.reload();
document.getElementById('jump').onclick=()=>{if(player.ground){player.vy=13;player.ground=false}};document.getElementById('gum').onclick=()=>{player.gumT=6;player.gum=1};document.getElementById('shoot').onclick=shoot;
function shoot(){if(!playing||player.ammo<=0)return;player.ammo--;let best=null,bd=999;for(const b of bots){if(b.dead)continue;let dx=b.x-player.x,dy=b.y-player.y,d=Math.hypot(dx,dy),ang=Math.atan2(dy,dx),diff=Math.abs(((ang-player.angle+Math.PI)%(Math.PI*2))-Math.PI);if(d<380&&diff<.38&&d<bd){bd=d;best=b}}if(best){best.hp-=28;if(best.hp<=0){best.dead=true;score++;document.getElementById('kills').textContent=score+' ELIMINAÇÕES'} }}
let moveX=0,moveY=0,lookX=0,lookY=0;function stick(el,axis){let active=false,base={x:0,y:0};el.setPointerCapture;el.addEventListener('pointerdown',e=>{active=true;base={x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!active)return;let dx=e.clientX-base.x,dy=e.clientY-base.y,r=Math.hypot(dx,dy)||1;dx*=Math.min(38,r)/r;dy*=Math.min(38,r)/r;if(axis==='move'){moveX=dx/38;moveY=dy/38}else{lookX=dx/38;lookY=dy/38}});el.addEventListener('pointerup',()=>{active=false;if(axis==='move'){moveX=0;moveY=0}else{lookX=0;lookY=0}})}stick(document.getElementById('moveStick'),'move');stick(document.getElementById('lookStick'),'look');
addEventListener('pointermove',e=>{if(!playing)return;if(e.pointerType==='mouse'&&e.buttons===2)player.angle+=(e.movementX||0)*.004});addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')shoot()});
function project(wx,wy,wz){let dx=wx-player.x,dy=wy-player.y,c=Math.cos(player.angle),s=Math.sin(player.angle),rx=dx*c-dy*s,rz=dx*s+dy*c;if(rz>5){return null}let d=Math.max(-rz,1);let sx=W/2+rx/d*420,sy=H*.58+wz/d*420;if(sx< -300||sx>W+300||sy<-300||sy>H+300)return null;return{s:420/d,x:sx,y:sy}}
function poly(points,color,stroke){ctx.fillStyle=color;ctx.strokeStyle=stroke||'rgba(0,0,0,.18)';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill();ctx.stroke()}
function drawWorld(){let m=maps[mapIndex];let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,m.sky);g.addColorStop(.58,m.sky);g.addColorStop(.59,m.ground);g.addColorStop(1,'#0a1020');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// horizon glow
ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.arc(W*.68,H*.25,70,0,7);ctx.fill();
// perspective grid
ctx.strokeStyle='rgba(255,255,255,.08)';for(let i=-12;i<=12;i++){let p1={x:W/2+i*22,y:H*.58},p2={x:W/2+i*110,y:H};ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke()}for(let i=0;i<12;i++){let y=H*.58+(H*.42)*Math.pow(i/11,1.8);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
// objects sorted by distance
let objs=[];for(let i=-1200;i<=1200;i+=180){for(let j=-1200;j<=1200;j+=180){if(Math.abs(i)<100&&Math.abs(j)<100)continue;objs.push({x:i+(j%360)/3,y:j,type:(Math.abs(i+j)%540),r:45})}}objs.push(...bots.filter(b=>!b.dead).map(b=>({x:b.x,y:b.y,type:777,r:18})));objs.sort((a,b)=>Math.hypot(b.x-player.x,b.y-player.y)-Math.hypot(a.x-player.x,a.y-player.y));
for(const o of objs){let p=project(o.x,o.y,0);if(!p)continue;let size=Math.max(3,Math.min(150,90/p.s));if(o.type===777){ctx.fillStyle='#ffcf65';ctx.beginPath();ctx.arc(p.x,p.y-size*1.6,size*.45,0,7);ctx.fill();ctx.fillStyle='#33265c';ctx.fillRect(p.x-size*.34,p.y-size*1.2,size*.68,size*1.45)}else if(mapIndex===1){ctx.fillStyle='#6c3c24';ctx.fillRect(p.x-size*.45,p.y-size*1.25,size*.9,size*1.25);ctx.fillStyle='#f2d28b';ctx.beginPath();ctx.moveTo(p.x,p.y-size*2);ctx.lineTo(p.x+size*.8,p.y-size*.45);ctx.lineTo(p.x-size*.8,p.y-size*.45);ctx.fill()}else if(mapIndex===4){ctx.fillStyle='#171744';ctx.fillRect(p.x-size*.7,p.y-size*3,size*1.4,size*3);ctx.fillStyle=m.accent;for(let k=0;k<4;k++){ctx.fillRect(p.x-size*.5,p.y-size*(2.7-k*.55),size*.18,size*.13);ctx.fillRect(p.x+size*.18,p.y-size*(2.7-k*.55),size*.18,size*.13)}}else{ctx.fillStyle=o.type>300?'#bc6a57':'#7d4d88';ctx.fillRect(p.x-size*.55,p.y-size*1.8,size*1.1,size*1.8);ctx.fillStyle='rgba(255,220,100,.8)';ctx.fillRect(p.x-size*.25,p.y-size*1.45,size*.16,size*.25);ctx.fillRect(p.x+size*.1,p.y-size*1.45,size*.16,size*.25)}}
// player/gum
ctx.save();ctx.translate(W/2,H*.68-player.vy*4);ctx.fillStyle='#2b213f';ctx.beginPath();ctx.ellipse(0,28,28,10,0,0,7);ctx.fill();ctx.fillStyle='#d89b82';ctx.beginPath();ctx.arc(0,-36,18,0,7);ctx.fill();ctx.fillStyle='#44209a';ctx.fillRect(-22,-18,44,48);ctx.fillStyle='#ffdc42';ctx.fillRect(-5,-13,10,20);ctx.restore();
if(player.gumT>0){let s=40+Math.sin(performance.now()/90)*5+player.gum*12;ctx.save();ctx.globalAlpha=Math.min(1,player.gumT);let gr=ctx.createRadialGradient(W/2-s*.25,H*.53-s*.25,2,W/2,H*.53,s);gr.addColorStop(0,'#ffeff8');gr.addColorStop(.18,'#70efff');gr.addColorStop(.48,'#ff62c7');gr.addColorStop(.75,'#9b66ff');gr.addColorStop(1,'#ff8ad0');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(W/2,H*.53,s,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;ctx.stroke();ctx.restore()}
// neon/chicle particles
ctx.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<18;i++){let x=(i*137+performance.now()/25)%W,y=(i*83)%H*.55;ctx.beginPath();ctx.arc(x,y,1+(i%3),0,7);ctx.fill()}
}
function update(dt){if(!playing)return;let sp=(keys['shift']?250:150)*dt;let mx=moveX+(keys['d']?1:0)-(keys['a']?1:0),my=moveY+(keys['s']?1:0)-(keys['w']?1:0);player.angle+=lookX*dt*2+(keys['arrowright']?2*dt:0)-(keys['arrowleft']?2*dt:0);player.x+=(-Math.sin(player.angle)*my+Math.cos(player.angle)*mx)*sp;player.y+=(-Math.cos(player.angle)*my-Math.sin(player.angle)*mx)*sp;if(!player.ground){player.vy-=28*dt;if(player.vy<0&&-player.vy>12-player.vy){ } }player.vy-=22*dt; if(!player.ground){player.vy-=18*dt;if(player.vy<-10&&H>0){} } // jump gravity
if(!player.ground){player.vy-=20*dt;if(player.vy<-12){player.vy=-12;player.ground=true}} if(keys[' ']&&player.ground){player.vy=13;player.ground=false}if(player.gumT>0){player.gumT-=dt}for(const b of bots){if(b.dead)continue;b.phase+=dt*.8;b.x+=Math.sin(b.phase)*dt*8;b.y+=Math.cos(b.phase*.7)*dt*8}time-=dt;if(time<0)time=0;document.getElementById('timer').textContent=Math.floor(time/60)+':'+String(Math.floor(time%60)).padStart(2,'0');document.getElementById('hp').style.width=player.hp+'%';document.getElementById('hptext').textContent='HP '+Math.ceil(player.hp)+' / 100';if(score>=18)won=true}
function loop(now){if(!playing)return;let dt=Math.min((now-last)/1000,.04);last=now;update(dt);drawWorld();if(won){ctx.fillStyle='rgba(20,10,50,.65)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='italic 900 44px Impact';ctx.fillText('CHICLE VITÓRIA!',W/2,H/2);ctx.font='900 14px Arial';ctx.fillText(score+' ELIMINAÇÕES',W/2,H/2+30)}requestAnimationFrame(loop)}
</script></body></html>
