<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DROPZONE — Battle Royale</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071019;font-family:Inter,Arial,sans-serif;color:white;user-select:none}canvas{display:block}.ui{position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(650px,80vw);text-align:center}.brand{font-size:18px;font-weight:900;font-style:italic;letter-spacing:2px;text-shadow:0 2px 8px #000}.zone{margin-top:8px;height:6px;background:rgba(255,255,255,.14);border-radius:9px;overflow:hidden}.zone i{display:block;height:100%;width:100%;background:#f7c84b}.phase{position:absolute;top:36px;right:28px;text-align:right}.phase b{display:block;font-size:18px}.phase span{font-size:12px;color:#b6c4cc}.stats{position:absolute;left:24px;top:24px}.alive{font-size:32px;font-weight:900}.alive small{font-size:12px;color:#bdc9cf}.kills{margin-top:4px;color:#f7c84b;font-weight:800}.health{position:absolute;left:24px;bottom:28px;width:min(330px,42vw)}.healthrow{display:flex;gap:8px;align-items:center}.hpbar{flex:1;height:16px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.18);border-radius:4px;overflow:hidden}.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffb52f,#ffe37a)}.ammo{position:absolute;right:28px;bottom:30px;text-align:right}.ammo b{font-size:42px;font-style:italic}.ammo span{display:block;font-size:13px;color:#bac5ca}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}.cross:before{width:18px;height:2px;top:8px}.cross:after{height:18px;width:2px;left:8px}.minimap{position:absolute;right:24px;top:68px;width:150px;height:150px;border:2px solid rgba(255,255,255,.25);border-radius:50%;background:radial-gradient(circle,rgba(118,154,92,.7),rgba(35,74,51,.9));overflow:hidden}.minimap:before{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 3px #f5aa35}.ring{position:absolute;border:2px solid #69aefa;border-radius:50%;left:18%;top:18%;width:64%;height:64%}.feed{position:absolute;left:24px;top:125px;font-size:12px;color:#dde5e7}.feed div{margin:5px 0;padding:4px 8px;background:rgba(0,0,0,.28);border-left:2px solid #f7c84b}.menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:linear-gradient(90deg,rgba(5,12,18,.92),rgba(5,12,18,.15));transition:.25s}.menu.hide{opacity:0;pointer-events:none}.menu .card{width:min(560px,85vw);margin-right:35vw}.menu h1{font-size:clamp(44px,8vw,86px);line-height:.85;margin:0;font-style:italic;letter-spacing:-5px}.menu h1 span{color:#f7b82e}.menu p{max-width:420px;color:#bac6cc}.btn{border:0;background:#f5b72e;color:#151a1d;font-weight:900;font-size:16px;padding:15px 24px;border-radius:3px;cursor:pointer;clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);pointer-events:auto}.controls{margin-top:20px;display:flex;gap:14px;font-size:11px;color:#aeb9be}.controls b{color:#fff}.damage{position:absolute;inset:0;opacity:0;background:radial-gradient(circle,transparent 45%,rgba(255,40,20,.8));transition:opacity .12s}.damage.on{opacity:.7}.lootmsg{position:absolute;top:58%;left:50%;transform:translateX(-50%);font-weight:900;color:#ffe28a;text-shadow:0 2px 5px #000;opacity:0;transition:.2s}.lootmsg.on{opacity:1}.players{position:absolute;left:24px;bottom:62px;color:#bac5ca;font-size:12px}.players b{color:#fff}.players i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#66d6a4;margin-right:5px}.touch{display:none}.stick{position:absolute;width:120px;height:120px;border-radius:50%;left:24px;bottom:85px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.15);pointer-events:auto}.stick i{position:absolute;width:48px;height:48px;border-radius:50%;left:36px;top:36px;background:rgba(255,255,255,.25)}.fire{position:absolute;width:88px;height:88px;border-radius:50%;right:25px;bottom:110px;background:rgba(213,61,43,.45);border:2px solid rgba(255,255,255,.35);pointer-events:auto}.fire:after{content:"FIRE";position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:13px}@media(max-width:700px),(pointer:coarse){.touch{display:block}.minimap{width:105px;height:105px;right:12px;top:55px}.phase{right:12px}.stats{left:12px}.health{left:12px;bottom:18px;width:220px}.ammo{right:12px;bottom:22px}.ammo b{font-size:28px}.feed{display:none}.menu .card{margin:0;width:90vw}.controls{display:none}.topbar{top:10px}.stick{bottom:30px}.fire{bottom:30px}}
</style></head>
<body>
<div id="game"></div><div class="ui"><div class="topbar"><div class="brand">DROPZONE</div><div class="zone"><i id="zonebar"></i></div></div><div class="stats"><div class="alive"><span id="alive">32</span> <small>ALIVE</small></div><div class="kills"><span id="kills">0</span> KILLS</div></div><div class="phase"><b id="phase">FASE 1</b><span id="timer">02:30</span></div><div class="minimap"><div class="ring"></div></div><div class="feed" id="feed"></div><div class="cross"></div><div class="health"><div class="healthrow"><span>+</span><div class="hpbar"><i id="hpbar"></i></div></div></div><div class="ammo"><b id="ammo">30</b><span id="weapon">AR-4 / AUTO</span></div><div class="lootmsg" id="lootmsg">MUNIÇÃO +30</div><div class="players" id="players"><i></i><b id="playerCount">1</b> JOGADORES ONLINE</div><div class="damage" id="damage"></div><div class="touch"><div class="stick" id="stick"><i></i></div><div class="fire" id="fire"></div></div><div class="menu" id="menu"><div class="card"><h1>DROP<br><span>ZONE</span></h1><p>Sobreviva à zona. Acerte os inimigos. Encontre armas e munição espalhadas pelo mapa.</p><button class="btn" id="start">INICIAR COMBATE</button><div class="controls"><span><b>WASD</b> MOVER</span><span><b>MOUSE</b> MIRAR</span><span><b>CLICK</b> ATIRAR</span><span><b>R</b> RECARREGAR</span></div></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const host=document.getElementById('game'),menu=document.getElementById('menu');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9db4aa);scene.fog=new THREE.Fog(0x9db4aa,38,110);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xddeeff,0x566046,2));const sun=new THREE.DirectionalLight(0xfff1d2,2.5);sun.position.set(-30,45,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=sun.shadow.camera.bottom=-70;sun.shadow.camera.right=sun.shadow.camera.top=70;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshStandardMaterial({color:0x65764d,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const rand=(a,b)=>a+Math.random*(b-a); // bug fixed below
const randF=(a,b)=>a+Math.random()*(b-a);
function box(w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.8}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
// Terrain and buildings
for(let i=0;i<80;i++){box(randF(.4,2),randF(.4,1.5),randF(.4,2),0x4d603b,randF(-78,78),.2,randF(-78,78))}
for(let i=0;i<18;i++){const x=randF(-65,65),z=randF(-65,65),w=randF(5,12),d=randF(5,10);box(w,randF(4,8),d, i%2?0x7b806a:0x9a9278,x,h=4,z);box(w+.4,.25,d+.4,0x4a4b43,x,8.2,z)}
// road
box(140,.04,7,0x4c4c45,0,.025,0);box(7,.05,140,0x4c4c45,0,.026,0);
// trees
for(let i=0;i<35;i++){let x=randF(-82,82),z=randF(-82,82);box(.8,5,.8,0x4c3524,x,2.5,z);let c=new THREE.Mesh(new THREE.ConeGeometry(3.5,7,7),new THREE.MeshStandardMaterial({color:0x29472f}));c.position.set(x,7,z);c.castShadow=true;scene.add(c)}
// zone walls
const zone=new THREE.Mesh(new THREE.CylinderGeometry(73,73,20,64,1,true),new THREE.MeshBasicMaterial({color:0x55aaff,transparent:true,opacity:.12,side:THREE.DoubleSide,depthWrite:false}));zone.position.y=10;scene.add(zone);
function makePlayer(enemy=false){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(.9,1.25,.55),new THREE.MeshStandardMaterial({color:enemy?0x8d3e32:0x313c43}));body.position.y=1.25;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.35,12,8),new THREE.MeshStandardMaterial({color:enemy?0x5a332b:0xb58a65}));head.position.y=2.28;head.castShadow=true;g.add(head);for(const x of [-.55,.55]){let arm=new THREE.Mesh(new THREE.BoxGeometry(.25,.95,.25),new THREE.MeshStandardMaterial({color:enemy?0x7b3028:0x26343b}));arm.position.set(x,1.35,.05);arm.rotation.z=x<0?.25:-.25;g.add(arm)}let gun=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,1.15),new THREE.MeshStandardMaterial({color:0x20262a,metalness:.5}));gun.position.set(.45,1.45,-.55);g.add(gun);return g}
const player=makePlayer(false);player.position.set(0,0,16);scene.add(player);
let enemies=[];for(let i=0;i<16;i++){let e=makePlayer(true),a=randF(0,Math.PI*2),r=randF(20,68);e.position.set(Math.cos(a)*r,0,Math.sin(a)*r);e.userData={hp:50,shoot:randF(.5,2),speed:randF(1.8,3)};scene.add(e);enemies.push(e)}
let loot=[];for(let i=0;i<12;i++){let m=new THREE.Mesh(new THREE.BoxGeometry(.7,.35,.7),new THREE.MeshStandardMaterial({color:0xf2c44e,emissive:0x4a3100,metalness:.3}));m.position.set(randF(-70,70),.25,randF(-70,70));scene.add(m);loot.push(m)}
let yaw=0,pitch=-.12,health=100,ammo=30,kills=0,started=false,reloading=false,lastShot=0,keys={};camera.position.set(0,4,10);
// Multiplayer via BroadcastChannel: each open tab is a real synced player.
const playerId='P'+Math.random().toString(36).slice(2,7).toUpperCase();
const peers=new Map();
let channel=null;
if('BroadcastChannel' in window){channel=new BroadcastChannel('dropzone-multiplayer-v1');channel.onmessage=e=>{const d=e.data;if(!d||d.id===playerId)return;if(d.type==='hello'||d.type==='state'){if(!peers.has(d.id)){const p=makePlayer(true);p.userData.peer=true;p.userData.name=d.name||d.id;p.userData.hp=100;scene.add(p);peers.set(d.id,p)}const p=peers.get(d.id);if(d.x!==undefined){p.position.set(d.x,d.y||0,d.z);p.rotation.y=d.rot||0}if(d.type==='hello'&&channel)channel.postMessage({type:'state',id:playerId,name:playerId,x:player.position.x,y:0,z:player.position.z,rot:yaw})}else if(d.type==='leave'){const p=peers.get(d.id);if(p)scene.remove(p);peers.delete(d.id)}};channel.postMessage({type:'hello',id:playerId,name:playerId});window.addEventListener('beforeunload',()=>channel.postMessage({type:'leave',id:playerId}))}
function updatePeers(){const n=peers.size+1;const el=document.getElementById('playerCount');if(el)el.textContent=n;if(channel&&started)channel.postMessage({type:'state',id:playerId,name:playerId,x:player.position.x,y:0,z:player.position.z,rot:yaw,health})}
setInterval(updatePeers,100);
function setDamage(on){document.getElementById('damage').classList.toggle('on',on)}
document.addEventListener('keydown',e=>keys[e.code]=true);document.addEventListener('keyup',e=>{keys[e.code]=false;if(e.code=='KeyR')reload()});
function reload(){if(reloading||ammo==30)return;reloading=true;document.getElementById('weapon').textContent='RECARREGANDO';setTimeout(()=>{ammo=30;reloading=false;document.getElementById('ammo').textContent=ammo;document.getElementById('weapon').textContent='AR-4 / AUTO'},900)}
function aim(e){if(!started)return;yaw-=e.movementX*.0025;pitch-=e.movementY*.0025;pitch=Math.max(-.65,Math.min(.45,pitch))}
renderer.domElement.addEventListener('click',()=>{if(started&&!document.pointerLockElement)renderer.domElement.requestPointerLock()});document.addEventListener('mousemove',aim);
function shoot(){if(!started||reloading)return;if(performance.now()-lastShot<110)return;if(ammo<=0){reload();return}lastShot=performance.now();ammo--;document.getElementById('ammo').textContent=ammo;let dir=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),-Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));let origin=player.position.clone().add(new THREE.Vector3(0,1.6,0));let beam=new THREE.Mesh(new THREE.BoxGeometry(.025,.025,1.2),new THREE.MeshBasicMaterial({color:0xffdf72}));beam.position.copy(origin).add(dir.clone().multiplyScalar(.9));beam.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),dir);scene.add(beam);setTimeout(()=>scene.remove(beam),60);
let nearest=null,best=Infinity;for(const e of enemies){if(!e.parent)continue;let to=e.position.clone().sub(origin).normalize(),dot=to.dot(dir),dist=e.position.distanceTo(origin);if(dot>.985&&dist<70&&dist<best){nearest=e;best=dist}}if(nearest){nearest.userData.hp-=34;if(nearest.userData.hp<=0){scene.remove(nearest);enemies=enemies.filter(x=>x!==nearest);kills++;document.getElementById('kills').textContent=kills;document.getElementById('alive').textContent=31-kills;let f=document.createElement('div');f.textContent='Você eliminou um inimigo';document.getElementById('feed').prepend(f)}}}
renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0)shoot()});
document.getElementById('start').onclick=()=>{started=true;menu.classList.add('hide');renderer.domElement.requestPointerLock?.()};
// touch controls
let touchMove={x:0,y:0},touchLook=null;const stick=document.getElementById('stick');stick.addEventListener('touchmove',e=>{e.prevent.preventDefault?.();const r=stick.getBoundingRect();let t=e.touches[0];touchMove.x=(t.clientX-(r.left+60))/60;touchMove.y=(t.clientY-(r.top+60))/60;touchMove.x=Math.max(-1,Math.min(1,touchMove.x));touchMove.y=Math.max(-1,Math.min(1,touchMove.y));stick.querySelector('i').style.transform=`translate(${touchMove.x*30}px,${touchMove.y*30}px)`},{passive:false});stick.addEventListener('touchend',()=>{touchMove={x:0,y:0};stick.querySelector('i').style.transform='' });
document.getElementById('fire').addEventListener('touchstart',e=>{e.preventDefault();shoot()});
renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length===1)touchLook={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:false});renderer.domElement.addEventListener('touchmove',e=>{if(touchLook&&e.touches.length===1){let t=e.touches[0];yaw-=((t.clientX-touchLook.x)*.006);pitch-=((t.clientY-touchLook.y)*.004);pitch=Math.max(-.65,Math.min(.45,pitch));touchLook={x:t.clientX,y:t.clientY}}},{passive:false});
let phaseTime=150,phase=1;setInterval(()=>{if(started){phaseTime--;let m=Math.floor(phaseTime/60),s=phaseTime%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(phaseTime<=0&&phase<5){phase++;phaseTime=120;document.getElementById('phase').textContent='FASE '+phase}}},1000);
let clock=new THREE.Clock(),hurtCooldown=0;
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);if(started){let forward=(keys.KeyW?1:0)-(keys.KeyS?1:0)-touchMove.y,side=(keys.KeyD?1:0)-(keys.KeyA?1:0)+touchMove.x;let len=Math.hypot(forward,side)||1;forward/=len;side/=len;let sp=9*dt,dx=(Math.sin(yaw)*forward+Math.cos(yaw)*side)*sp,dz=(-Math.cos(yaw)*forward+Math.sin(yaw)*side)*sp;player.position.x=Math.max(-78,Math.min(78,player.position.x+dx));player.position.z=Math.max(-78,Math.min(78,player.position.z+dz));player.rotation.y=yaw;
for(const e of enemies){let d=e.position.distanceTo(player.position);if(d<30){let dir=player.position.clone().sub(e.position).normalize();if(d>7)e.position.add(dir.clone().multiplyScalar(e.userData.speed*dt));e.lookAt(player.position.x,e.position.y,player.position.z);e.userData.shoot-=dt;if(d<16&&e.userData.shoot<=0){e.userData.shoot=randF(.8,2.2);health-=randF(3,7);health=Math.max(0,health);document.getElementById('hpbar').style.width=health+'%';setDamage(true);setTimeout(()=>setDamage(false),100);if(health<=0){started=false;menu.classList.remove('hide');menu.querySelector('h1').innerHTML='GAME<br><span>OVER</span>';menu.querySelector('.btn').textContent='JOGAR NOVAMENTE';menu.querySelector('.btn').onclick=()=>location.reload()}}}}
for(let i=loot.length-1;i>=0;i--){let l=loot[i];l.rotation.y+=dt;l.position.y=.25+Math.sin(performance.now*.003+i)*.08;if(l.position.distanceTo(player.position)<2){ammo=Math.min(90,ammo+30);document.getElementById('ammo').textContent=ammo;let msg=document.getElementById('lootmsg');msg.classList.add('on');setTimeout(()=>msg.classList.remove('on'),800);scene.remove(l);loot.splice(i,1)}}
let dist=Math.hypot(player.position.x,player.position.z);if(dist>70){health-=dt*4;document.getElementById('hpbar').style.width=Math.max(0,health)+'%';setDamage(true)}else setDamage(false)
let camTarget=player.position.clone().add(new THREE.Vector3(0,3.2,0));camera.position.lerp(player.position.clone().add(new THREE.Vector3(Math.sin(yaw)*7,4.2, -Math.cos(yaw)*7)),.12);camera.lookAt(camTarget.add(new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch)*20,-Math.sin(pitch)*20,-Math.cos(yaw)*Math.cos(pitch)*20)));
}else{camera.position.lerp(new THREE.Vector3(16,7,25),.03);camera.lookAt(player.position)}renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
